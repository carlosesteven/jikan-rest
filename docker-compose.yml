version: '3.8'
volumes:
  mongo-data: { }
  redis-data: { }
  typesense-data: { }

networks:
  jikan_network: { }

secrets:
  db_username:
    file: db_username.txt
  db_password:
    file: db_password.txt
  db_admin_username:
    file: db_admin_username.txt
  db_admin_password:
    file: db_admin_password.txt
  redis_password:
    file: redis_password.txt
  typesense_api_key:
    file: typesense_api_key.txt

services:
  jikan_rest:
    image: "docker.io/jikanme/jikan-rest:${_JIKAN_API_VERSION:-latest}"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: unless-stopped
    networks:
      - jikan_network
    secrets:
      - db_username
      - db_password
      - typesense_api_key
      - redis_password
    environment:
      PS1: '\[\033[1;32m\]\[\033[1;36m\][\u@\h] \[\033[1;34m\]\w\[\033[0;35m\] \[\033[1;36m\]# \[\033[0m\]'
    env_file:
      - ./docker/config/.env.compose
    ports:
      - '8080:8080/tcp'
    hostname: jikan-rest-api
    healthcheck:
      # Also exercises the redis-backed microcache middleware (via a fast,
      # MAL-independent route) so a broken app<->redis connection is caught,
      # not just whether the RoadRunner HTTP plugin itself is up. RoadRunner
      # load-balances across one worker per CPU, and only workers that had
      # already opened a redis connection go stale after a redis restart, so
      # this probes several times per check to sample across the pool
      # instead of risking a single lucky/unlucky worker.
      test: [ 'CMD-SHELL', 'wget --spider -q "http://127.0.0.1:2114/health?plugin=http" || exit 1; for i in $$(seq 1 8); do code=$$(curl -s --max-time 2 -o /dev/null -w ''%{http_code}'' http://127.0.0.1:8080/v4/genres/anime); [ "$$code" = "200" ] || exit 1; done' ]
      interval: 2s
      timeout: 5s
      retries: 3
    links:
      - mongodb:mongodb
      - redis:redis
      - typesense:typesense
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      typesense: { condition: service_started }

  mongodb:
    image: docker.io/mongo:focal
    hostname: mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - 27017/tcp
    command: "--wiredTigerCacheSizeGB ${MONGO_CACHE_SIZE_GB:-1.0}"
    networks:
      - jikan_network
    secrets:
      - db_username
      - db_password
      - db_admin_username
      - db_admin_password
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_admin_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_admin_password
      MONGO_INITDB_DATABASE: jikan_admin
    healthcheck:
      test: [ 'CMD-SHELL', 'mongosh mongodb://localhost:27017 --quiet --eval "db.runCommand(\"ping\").ok"' ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: docker.io/redis:6-alpine
    hostname: redis
    restart: unless-stopped
    secrets:
      - redis_password
    networks:
      - jikan_network
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis-data:/data:rw
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG' ]
      interval: 500ms
      timeout: 1s

  typesense:
    image: docker.io/typesense/typesense:0.24.1
    hostname: typesense
    entrypoint: /bin/sh
    secrets:
      - typesense_api_key
    networks:
      - jikan_network
    command:
      - -c
      - TYPESENSE_API_KEY="$$(cat /run/secrets/typesense_api_key)" /opt/typesense-server --data-dir /data
    restart: unless-stopped
    volumes:
      - typesense-data:/data
    ports:
      - "8108/tcp"
