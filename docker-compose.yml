version: '3.8'
volumes:
  mongo-data: { }
  redis-data: { }
  typesense-data: { }

networks:
  jikan_network: { }

secrets:
  db_username:
    file: db_username.txt
  db_password:
    file: db_password.txt
  db_admin_username:
    file: db_admin_username.txt
  db_admin_password:
    file: db_admin_password.txt
  redis_password:
    file: redis_password.txt
  typesense_api_key:
    file: typesense_api_key.txt

services:
  jikan_rest:
    image: "docker.io/jikanme/jikan-rest:${_JIKAN_API_VERSION:-latest}"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    restart: unless-stopped
    networks:
      - jikan_network
    secrets:
      - db_username
      - db_password
      - typesense_api_key
      - redis_password
    environment:
      PS1: '\[\033[1;32m\]\[\033[1;36m\][\u@\h] \[\033[1;34m\]\w\[\033[0;35m\] \[\033[1;36m\]# \[\033[0m\]'
    env_file:
      - ./docker/config/.env.compose
    ports:
      - '8080:8080/tcp'
    hostname: jikan-rest-api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    healthcheck:
      test: [ 'CMD-SHELL', 'wget --spider -q "http://127.0.0.1:2114/health?plugin=http"' ]
      interval: 2s
      timeout: 2s
    links:
      - mongodb:mongodb
      - redis:redis
      - typesense:typesense
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      typesense: { condition: service_started }

  mongodb:
    image: docker.io/mongo:focal
    hostname: mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: "--wiredTigerCacheSizeGB ${MONGO_CACHE_SIZE_GB:-0.4}"
    networks:
      - jikan_network
    secrets:
      - db_username
      - db_password
      - db_admin_username
      - db_admin_password
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/db_admin_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_admin_password
      MONGO_INITDB_DATABASE: jikan_admin
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 640M
    healthcheck:
      test: [ 'CMD-SHELL', 'mongosh mongodb://localhost:27017 --quiet --eval "db.runCommand(\"ping\").ok"' ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: docker.io/redis:6-alpine
    hostname: redis
    restart: unless-stopped
    secrets:
      - redis_password
    networks:
      - jikan_network
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis-data:/data:rw
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 320M
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG' ]
      interval: 500ms
      timeout: 1s

  typesense:
    image: docker.io/typesense/typesense:0.24.1
    hostname: typesense
    entrypoint: /bin/sh
    secrets:
      - typesense_api_key
    networks:
      - jikan_network
    command:
      - -c
      - TYPESENSE_API_KEY="$$(cat /run/secrets/typesense_api_key)" /opt/typesense-server --data-dir /data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 272M
    volumes:
      - typesense-data:/data
